name: Build Android APK (Native)
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: 🏗 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🏗 Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 📦 Install dependencies
        run: |
          cd artifacts/mobile
          pnpm install --no-frozen-lockfile

      - name: 🛠 Prebuild Android
        run: |
          cd artifacts/mobile
          npx expo prebuild --platform android --non-interactive --no-install

      - name: 🚀 Build Android APK
        run: |
          cd artifacts/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLN-Logistics-APK
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
